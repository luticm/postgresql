services:
  pgsql:
    build: .
    restart: no
    cpus: "4.0"
    mem_limit: 8g
    environment:
      POSTGRES_USER: your_user
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: postgres
    ports:
      - 54318:5432
    volumes:
      - .\fs\data:/var/lib/postgresql/18/docker/
      - ..\..\scripts\:/home/scripts
      - .\fs\scripts:/home/dockerscripts
    networks:
      - pgsharednet

networks:
  pgsharednet:
    external: true
